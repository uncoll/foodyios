# Запасной вариант: если Foody.xcodeproj не открывается в вашей версии Xcode,
# сгенерируйте проект заново:  brew install xcodegen && xcodegen generate
name: Foody
options:
  bundleIdPrefix: com.uncoll
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  FoodyCore:
    path: FoodyCore
targets:
  Foody:
    type: application
    platform: iOS
    sources:
      - path: Foody
    dependencies:
      - package: FoodyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uncoll.foody
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Foody
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна, чтобы сфотографировать этикетку и распознать пищевую ценность."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Доступ к фото нужен, чтобы выбрать снимок этикетки."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
